const DESK = {"slug":"team-musso","client":"Team Musso","desk":"Intelligence","from":"Nextier Intelligence","nav":[["Hunt Engine","paul-land-hunt.html"],["Property Book","paul-land-hunt.html#book"]],"eyebrow":"Local + statewide · land, approvals, buyers","title":"What moved this month, and what it means for your book","intro":"Three things to know first. Everything else is one tap away, with why it matters to you.","description":"Local and statewide news that moves land, approvals and buyers, for Team Musso.","updated":"2026-10-17","areas":[{"key":"statewide","label":"Statewide","sub":"laws, programs, rates","pill":""},{"key":"li","label":"Long Island","sub":"Nassau · Suffolk","pill":"b"},{"key":"hv","label":"Hudson Valley + Westchester","short":"Hudson Valley","sub":"Westchester · Putnam · Dutchess · Orange · Ulster · Columbia","pill":"g"},{"key":"nyc","label":"Bronx + NYC","sub":"background that still shapes the market","pill":"w"}],"top":["shoreham","rates","s8662"],"sortDates":{"Pending":"2026-01-08","Fall 2026":"2026-09-22","Filed Mar 2025":"2025-03"},"items":[["shoreham","li","2026-10-15","LongIsland.com","Hochul announces the largest Long Island land acquisition by the DEC in history","https://www.longisland.com/news/10-15-26/governor-hochul-announces-largest-long-island-dec-land-acquisition-in-history.html","The state is acquiring nearly 750 acres of open space around the former Shoreham nuclear plant in Suffolk County, to protect the pine barrens and the aquifer.","750 acres in Brookhaven come off the buildable map for good. Private land nearby that can still be split just got scarcer.","Land"],["rates","statewide","2026-10-15","Freddie Mac via FRED","The 30-year mortgage is at 7.40%","https://fred.stlouisfed.org/graph/?g=1XU7Y","Freddie Mac's weekly average held at 7.40% for the weeks of October 8 and 15, after 7.28% on October 1, when a year earlier it was 6.34% (Trading Economics). Rates crossed 7% for the first time since early 2025.","Retail buyers are priced out at 7%. The land buyers right now are builders and cash investors, and the owners who could not sell last year are the ones to call.","Rates"],["nar","statewide","2026-10-13","National Association of Realtors","Home sales eke out an uptick, but the mortgage rate threat looms","https://www.nar.realtor/news/real-estate-news/economy/home-sales-eke-out-uptick-but-mortgage-rate-threat-looms","Existing-home sales edged up in September, with more buyers closing than in August. With rates above 7%, many buyers are recalculating what they can afford.","Thin retail demand keeps expired listings expired. Your aged expired book grows every month this lasts.","Market"],["beacon","hv","2026-10-13","Westfair Communications","Developer wants to add to an approved Beacon project","https://westfaironline.com/apartments/developer-wants-to-add-to-approved-beacon-project/","A developer returned to the City of Beacon with an amended plan to expand a project approved in 2023 at 393 and 397 Fishkill Ave. and 7 Conklin St.","A developer growing an approved site is a buyer for the land next to it. That is the developer-on-deal signal on every lot page.","Development"],["lijobs","li","2026-10-05","Melville Chamber of Commerce","Long Island construction jobs fall 1,400 in a year, among the steepest drops in the U.S.","https://melvillechamber.org/news/long-island-construction-jobs-down-1400-agc-metro-ranking/","Nassau and Suffolk lost 1,400 construction jobs in a year. Only 13 of 360 U.S. metro areas lost more.","Fewer builders are active. The ones still building are the land buyers to know by name.","Market"],["wpbonds","hv","2026-09-21","Westfair Communications","Westchester legislators approve $10.4M for an affordable housing project in White Plains","https://westfaironline.com/affordable-housing/westchester-legislators-approve-10-4m-for-affordable-housing-project-in-white-plains/","The county legislature approved bonds of up to $8.81 million to buy the land for an affordable housing building in White Plains.","The county itself buys land for housing. Public buyers belong on the buyer list next to developers.","Development"],["liprices","li","2026-09-29","Long Island Guide","Nassau and Suffolk prices rise despite slower sales and limited inventory","https://www.longislandguide.com/2026/09/29/long-island-housing-market-pushes-higher-as-nassau-and-suffolk-prices-rise-despite-slower-sales-limited-inventory/","Single-family medians in August: Nassau $911,000, up 4.7% from a year earlier; Suffolk $760,000, up 7.0%. Closed sales fell in both counties and inventory stayed tight.","Finished homes keep getting more valuable while supply stays short. The math on a buildable lot still works.","Market"],["villages","li","2026-08-12","Long Island Press","Villages lead in housing development on Long Island","https://www.longislandpress.com/2026/08/12/villages-and-housing/","Villages approved 33% more building permits per person than the unincorporated areas the towns govern directly.","Land inside a village tends to move through approvals faster. Each lot page now shows its town's permit count.","Approvals"],["qwest","hv","2026-08","Governor's Office","Construction underway on a 229-home affordable development in Mount Vernon","https://www.governor.ny.gov/news/governor-hochul-announces-construction-underway-229-unit-affordable-housing-development","QWest Towers, a $160 million development, is under construction and will create 229 homes in Mount Vernon.","Southern Westchester keeps absorbing density near transit. Sites near stations price off this.","Development",true],["orangesub","hv","2026-07-07","Orange County Planning Board","17 lots proposed on a 189-acre site that is 4 lots today","https://www.orangecountyny.gov/AgendaCenter/ViewFile/Minutes/_07072026-2808","The county planning board reviewed a 17-lot residential subdivision on 188.99 acres, each lot with its own septic and well, and the re-approval of a 72-unit Tuxedo Reserve North Ridge plan.","This is the exact play in your book: big acreage, split into lots on septic and well. The board minutes are where the next one shows up first.","Approvals",true],["s8662","statewide","2026-01-07","NY State Senate","S8662: towns could not cut how many homes a lot allows","https://www.nysenate.gov/legislation/bills/2025/S8662","Introduced January 7, 2026, the bill would bar cities, towns and villages from adopting rules that reduce the number or density of homes allowed. Companion bill A8834 sits in the Assembly Local Governments Committee. Pending, not law.","If it passes, a town cannot down-zone a lot in your book. Density would only move one way.","Policy"],["s8730","statewide","Pending","NY State Senate","S8730: rezoning before the comprehensive plan is finished","https://www.nysenate.gov/legislation/bills/2025/S8730","The bill would let cities, villages and towns adopt or amend comprehensive rezoning plans before their comprehensive plans are done. The sponsor notes many codes have not been updated in decades. Pending, not law.","Faster rezonings mean the upside on raw land arrives sooner.","Policy"],["prohousing","statewide","2026-08-10","Governor's Office","$62 million open to make housing safe, affordable and accessible","https://www.governor.ny.gov/news/governor-hochul-announces-62-million-available-make-housing-safe-affordable-and-accessible","Applications opened for more than $62 million through state housing programs. Separately, certified Pro-Housing Communities received $5 million in planning grants in February, and certification is tied to up to $650 million in state funding.","A Pro-Housing town wants approvals, because state money depends on it. Those are the towns to split land in.","Policy"],["sewer","li","2024-11","The Nature Conservancy","Suffolk's sewer and septic fund: what it pays for and where it lands first","https://www.nature.org/en-us/newsroom/suffolk-approves-prop2/","Voters approved an eighth-cent sales tax in November 2024 to fund sewer iffs challenges the three City of Yes rezonings, which the city expects to add 82,000 homes over 15 years. No ruling was found.","Until the case resolves, City of Yes density is the rule, with a question mark next to it.","Policy",true]],"boardsTitle":"Boards to watch","boardsSub":"where splits get approved","boards":[["Southampton Planning Board","Public hearings October 8 and October 22","https://www.southamptontownny.gov/320/Planning-Board"],["Islip Zoning Board of Appeals","Met October 13 at Town Hall West","https://www.islipny.gov/news/announcements/715-zoning-board-of-appeals-meeting-october-13th-2026"],["Riverhead Town Board + ZBA","Town Board October 6 · ZBA and work session October 8","https://riverheadminutes.com/"],["Suffolk County Planning Commission","Reviews subdivisions and zoning changes that cross county thresholds","https://www.suffolkcountyny.gov/Departments/Economic-Development-and-Planning/Planning-and-Environment/Regulatory-Review/Suffolk-County-Planning-Commission"],["Orange County Planning Board","Monthly minutes list every subdivision referred","https://www.orangecountyny.gov/AgendaCenter/ViewFile/Minutes/_07072026-2808"],["NYS Guide to Planning and Zoning Laws","The 2026 edition: how subdivision review works, board by board","https://dos.ny.gov/system/files/documents/2026/02/guide-to-planning-and-zoning-laws-in-nys.pdf"]],"memoRe":"land, approvals and buyers","footer":"Sources are the publishers linked on each story. \"Background\" marks a story older than three months that still shapes the market. Pending bills are pending: nothing here assumes they pass.","blog":{"title":"New York land and development: what moved in {month}","intro":"Land, approvals and buyers moved across New York this month. Here is what changed, region by region, with a link to every source.","outro":"Own land, or a house on a big lot, in New York and wondering what it is worth to a builder right now? Team Musso can walk you through it."},"deals":{"title":"Deals other const FORMATS = {

    return `<div class="eyebrow">Story mode · ${esc(month)}</div>
      <h2>${esc(month)}: what moved, and what it means for ${esc(DESK.client)}</h2>
      <p class="lede">${TOP.length === 3 ? "Three things" : `${TOP.length} things`} will shape the next 90 days. Here they are in order, then the rest of the month, region by region.</p>

      ${DEALS ? `<h3>${esc(DEALS.title)}</h3><p>${esc(DEALS.lead)} In the last two years: ${DEALS.stats.map(([v, l]) => `${n0(v)} ${esc(l)}`).join(", ")}.</p>${DEALS.stories.map((s) => `<p><b>${esc(s.headline)}.</b> ${s.chain.map(([, v]) => esc(v)).join(" ")} ${esc(s.lesson)} <b>Your next move:</b> ${esc(s.next)}</p>`).join("")}` : ""}
      ${current.map(([a, list]) => `<h3>${esc(a.label)}</h3>${list.map((n) => `<p>${esc(n.summary)} ${esc(n.why)} <span class="small">(${link(n)}, ${esc(day(n.date))})</span></p>`).join("")}`).join("")}
      ${background.length ? `<h3>Still shaping the market</h3>${background.map((n) => `<p>${esc(n.summary)} ${esc(n.why)} <span class="small">(${link(n)}, ${esc(day(n.date))})</span></p>`).join("")}` : ""}
      ${DESK.boards.length ? `<h3>Where the next deal shows up first</h3><p>${DESK.boards.map(([h, s]) => `<b>${esc(h)}</b>: ${esc(s)}.`).join(" ")}</p>` : ""}`;
  },
  memo() {
    return `<div class="eyebrow">Memo</div>
      <div class="memohead"><b>To</b><span>${esc(DESK.client)}</span><b>From</b><span>${esc(DESK.from)}</span><b>Date</b><span>${esc(updatedLong)}</span><b>Re</b><span>${esc(month)}: ${esc(DESK.memoRe)}</span></div>
      <h3>Bottom line</h3><ul>${TOP.map((n) => `<li><b>${esc(n.headline)}.</b> ${esc(n.why)}</li>`).join("")}</ul>
      ${DEALS ? `<h3>${esc(DEALS.title)}</h3><ul>${DEALS.stats.map(([v, l]) => `<li>${n0(v)} ${esc(l)}</li>`).join("")}${DEALS.stories.map((s) => `<li><b>${esc(s.headline)}:</b> ${esc(s.lesson)} ${esc(s.next)}</li>`).join("")}</ul>` : ""}
      <h3>What changed</h3>${current.map(([a, list]) => `<h4>${esc(a.label)}</h4><ul>${list.map((n) => `<li>${esc(n.headline)} <span class="small">(${esc(day(n.date))}, ${link(n)})</span></li>`).join("")}</ul>`).join("")}
      <h3>What it means for your book</h3><ul>${current.flatMap(([, list]) => list).map((n) => `<li>${esc(n.why)}</li>`).join("")}</ul>
      ${DESK.boards.length ? `<h3>Watch next</h3><ul>${DESK.boards.map(([h, s, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>: ${esc(s)}</li>`).join("")}</ul>` : ""}
      ${background.length ? `<h3>Background</h3><ul>${background.map((n) => `<li>${esc(n.headline)} <span class="small">(${esc(day(n.date))}, ${link(n)})</span></li>`).join("")}</ul>` : ""}`;

      ${current.map(([a, list]) => `<h3>${esc(a.label)}</h3>${list.map((n) => `<p><b>${esc(n.headline)}.</b> ${esc(n.summary)} <span class="small">(${link(n)})</span></p>`).join("")}`).join("")}

const MODES = [["feed", "Intelligence feed"], ["story", "Story"], ["memo", "Memo"], ["briefing", "Briefing"], ["blog", "Blog post"]];
let mode = "feed";
function setMode(m, push) {
  mode = FORMATS[m] ? m : "feed";
  $("#modes").innerHTML = MODES.map(([k, l]) => `<button class="mode" type="button" data-m="${k}" aria-pressed="${k === mode}">${l}</button>`).join(" ");
  const remix = mode !== "feed";
  $("#feedview").hidden = remix; $("#remixview").hidden = !remix;
  if (remix) $("#doc").innerHTML = FORMATS[mode]();
  $("#copy").textContent = "Copy text"; $("#copy").classList.remove("ok");
  if (push) history.replaceState(null, "", mode === "feed" ? location.pathname + location.search : "#" + mode);
}
$("#modes").addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (b) setMode(b.dataset.m, true); });

$("#print").addEventListener("click", () => window.print());
$("#copy").addEventListener("click", async () => {
  const text = $("#doc").innerText.trim();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove(); } catch (e2) {}
  }
  $("#copy").textContent = ok ? "Copied" : "Select the text to copy"; $("#copy").classList.toggle("ok", ok);
});

setMode(location.hash.slice(1), false);
})();
