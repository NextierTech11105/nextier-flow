<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parcelvora Story Mode</title>
<meta name="description" content="Every neighborhood in New York and Florida, told by its data, in 3D, with a walk-through and narration.">
<link rel="icon" href="parcelvora-fox.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
<style>
:root {
  --mint: #8bdad4; --mint-soft: #c8ece8; --mint-pale: #e8f7f5; --white: #fff;
  --ink: #333333; --ink-2: #474747; --line: #333333;
  --coral: #ef7f7a; --pink: #f6a8a4; --lime: #a8d26d; --gold: #e8c46e;
  --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--mint-pale); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }

.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--mint); border-bottom: 1.5px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.mark { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: #fdfcf8; border: 1.5px solid var(--line); flex-shrink: 0; }
.mark img { width: 100%; height: 100%; display: block; }
.word { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.word small { font-family: var(--sans); font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg .lbl { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-right: 2px; }
.seg button { border: 1.5px solid var(--line); background: var(--white); border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--mint); }

#map { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar-h, 64px); }
.mapmsg { position: fixed; right: 16px; top: calc(var(--bar-h, 64px) + 12px); z-index: 12; display: none; background: var(--white); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 600; max-width: 360px; }

.panel { position: fixed; z-index: 15; left: 20px; top: calc(var(--bar-h, 64px) + 18px); bottom: 20px; width: 450px; display: flex; flex-direction: column; background: var(--white); border: 2px solid var(--line); border-radius: 20px; box-shadow: 10px 10px 0 var(--mint); overflow: hidden; }
.p-scroll { flex: 1; overflow-y: auto; padding: 22px 22px 8px; }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { display: flex; align-items: center; gap: 9px; font: 700 15px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .12em; margin: 0; }
.eyebrow::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--coral); border: 1.5px solid var(--line); flex-shrink: 0; }
.count { font-size: 15px; font-weight: 700; white-space: nowrap; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1.04; letter-spacing: -0.02em; margin: 12px 0 0; }
.line { font-size: 18px; color: var(--ink-2); margin: 10px 0 0; }
.leg { margin-top: 12px; border-radius: 12px; background: var(--mint-pale); border: 1.5px solid var(--line); padding: 10px 14px; font-size: 17px; font-weight: 600; display: none; }
.leg b { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; }
.chart { margin-top: 16px; }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: minmax(0, 1.5fr) 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.brow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow i { display: block; height: 14px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--mint); min-width: 4px; }
.brow:nth-child(2n) i { background: var(--lime); }
.brow:nth-child(3n) i { background: var(--pink); }
.brow b { font-variant-numeric: tabular-nums; }
.cols { display: flex; align-items: flex-end; gap: 3px; height: 120px; border-bottom: 1.5px solid var(--line); }
.cols i { flex: 1; background: var(--mint); border: 1.5px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; min-height: 2px; }
.cols i.hi { background: var(--coral); }
.cols-x { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--mint-pale); min-width: 0; }
.stats b { display: block; font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.05; }
.stats span { font-size: 15px; }
.why { margin-top: 16px; border-radius: 12px; border: 1.5px solid var(--coral); background: #fff3f2; padding: 12px 14px; font-size: 16px; }
.why b { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
.legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); display: inline-block; }
.legend .ramp { width: 90px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); background: linear-gradient(90deg, #d6f0ed, #8bdad4, #5ebeb6, #a8d26d, #f6a8a4, #ef7f7a); }
.src { margin-top: 14px; font-size: 15px; color: var(--ink-2); }
.tip { margin-top: 10px; font-size: 15px; font-weight: 600; }
.cta { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 16px; }
.cta a { font-weight: 700; border-bottom: 2.5px solid var(--coral); text-decoration: none; padding-bottom: 2px; }
.p-ctl { border-top: 1.5px solid var(--line); padding: 12px 16px 14px; background: var(--mint-pale); }
.prog { height: 6px; border-radius: 3px; background: var(--mint-soft); overflow: hidden; border: 1px solid rgba(51,51,51,.35); }
.prog i { display: block; height: 100%; width: 0; background: var(--coral); }
.ctl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.btns { display: flex; gap: 8px; }
.btns button { min-width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--white); cursor: pointer; font-size: 16px; font-weight: 700; padding: 0 10px; white-space: nowrap; }
.btns button:hover { background: var(--ink); color: var(--mint); }
.btns button[aria-pressed="true"] { background: var(--ink); color: var(--mint); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.dots button { width: 13px; height: 13px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line); background: var(--white); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--coral); }

.lot { position: fixed; z-index: 16; right: 16px; bottom: 40px; width: 320px; display: none; background: var(--white); border: 2px solid var(--line); border-radius: 16px; box-shadow: 6px 6px 0 var(--coral); padding: 14px 16px; }
.lot h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0; line-height: 1.1; }
.lot ul { margin: 8px 0 0; padding-left: 18px; font-size: 16px; }
.lot .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.lot .tags span { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 15px; font-weight: 700; background: var(--mint-soft); }
.lot .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 20px; font-weight: 700; cursor: pointer; }
.lot p { font-size: 15px; margin: 8px 0 0; }

@media (max-width: 860px) {
  body { overflow-y: auto; }
  #map { position: relative; top: auto; height: 52vh; margin-top: var(--bar-h, 110px); }
  .mapmsg { position: absolute; }
  .panel { position: relative; left: auto; top: auto; bottom: auto; width: auto; margin: 14px 16px 24px; box-shadow: 6px 6px 0 var(--mint); }
  .p-scroll { overflow: visible; }
  h1 { font-size: 34px; }
  .word { font-size: 23px; }
  .lot { left: 16px; right: 16px; width: auto; top: calc(var(--bar-h, 110px) + 12px); bottom: auto; position: absolute; }
}
</style>
</head>
<body>

<div class="bar" id="bar">
  <a class="brand" href="parcelvora-landing.html">
    <span class="mark"><img src="parcelvora-fox.png" alt=""></span>
    <span class="word">Parcelvora<small>Story Mode</small></span>
  </a>
  <div class="seg" id="nbSeg" role="group" aria-label="Neighborhood"><span class="lbl">Place</span></div>
  <div class="seg" id="audSeg" role="group" aria-label="Audience"><span class="lbl">For</span></div>
</div>

<div id="map" aria-label="3D map of the neighborhood"></div>
<div class="mapmsg" id="mapmsg"></div>

<section class="panel" aria-live="polite">
  <div class="p-scroll">
    <div class="p-top"><p class="eyebrow" id="eyebrow"></p><span class="count" id="count"></span></div>
    <h1 id="title">Loading the story…</h1>
    <p class="line" id="line"></p>
    <div class="leg" id="leg"></div>
    <div class="chart" id="chart"></div>
    <div id="why"></div>
    <div class="legend" id="legend"></div>
    <p class="src" id="src"></p>
    <p class="tip">Tap anywhere on the map for that lot's story.</p>
    <div id="cta"></div>
  </div>
  <div class="p-ctl">
    <div class="prog"><i id="prog"></i></div>
    <div class="ctl-row">
      <div class="btns">
        <button id="prev" aria-label="Previous chapter">◀</button>
        <button id="play" aria-label="Pause">❚❚</button>
        <button id="next" aria-label="Next chapter">▶</button>
        <button id="voice" aria-pressed="false" aria-label="Narration">🔊 Voice</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</section>

<aside class="lot" id="lot" aria-live="polite"></aside>

<script>
(() => {
  const MAPBOX_TOKEN = "pk.eyJ1IjoibmV4dGllcjExMTA1IiwiYSI6ImNtaXVrbmRodTFrY3YzanEwamFoZG44dWQifQ.EGNVQPofUwZm60KP6iID_g";
  const PACE = 9000, LEG = 6500;
  const NB = {
    "park-slope":   { label: "Park Slope",   radius: 45,  maxH: 240,  zoom: 14.6, pitch: 58, cell: 0.0035, walkZoom: 16.8 },
    "east-hampton": { label: "East Hampton", radius: 380, maxH: 2200, zoom: 11.0, pitch: 50, cell: 0.02,   walkZoom: 15.4 },
    "coral-gables": { label: "Coral Gables", radius: 110, maxH: 650,  zoom: 13.0, pitch: 55, cell: 0.007,  walkZoom: 16.4 },
  };
  const AUD = { all: "Everyone", edu: "Education", re: "Real estate", biz: "Business brokers", open: "Opening a business" };
  const WHY_LABEL = { edu: "For classrooms", re: "For real estate", biz: "For business brokers", open: "For opening a business" };
  const USE = { one_family: "Single-family", two_family: "Two-family", three_family: "Three-family", multifamily: "Apartment buildings",
    multifamily_small: "Small apartment bldgs", mixed_use: "Mixed use", condo: "Condos", coop: "Co-ops", commercial: "Commercial",
    industrial: "Industrial", vacant_res: "Empty lots", vacant_other: "Other vacant", vacant_commercial: "Vacant commercial",
    parking: "Parking", motel_hotel: "Hotels + motels", utility: "Utility", community: "Community", forest_park: "Parks + forest",
    agricultural: "Farms", government: "Government", other: "Other", marina: "Marinas", golf: "Golf", strip_center: "Shopping centers",
    recreation: "Recreation", nursery: "Nurseries", seasonal: "Seasonal", rural_estate: "Rural estates", camp_rv: "Camps + RV",
    bar_nightclub: "Bars", car_lot: "Car lots", multi_structure_res: "Multi-house lots", residential_other: "Other residential", mobile_home: "Mobile homes" };
  const OWN = { individual: "Individuals", entity: "Companies (LLC, corp)", trust: "Trusts", estate: "Estates", public: "Public", unknown: "Unknown" };
  const GROUP = { 1: ["Houses", [94, 190, 182]], 2: ["Condos + co-ops", [168, 210, 109]], 3: ["Apartments", [246, 168, 164]], 4: ["Mixed use", [239, 127, 122]],
    5: ["Commercial", [51, 51, 51]], 6: ["Industrial", [130, 130, 130]], 7: ["Vacant", [232, 196, 110]], 8: ["Public + parks", [176, 222, 160]], 9: ["Other", [205, 205, 205]] };
  const RAMP = [[214, 240, 237], [139, 218, 212], [94, 190, 182], [168, 210, 109], [246, 168, 164], [239, 127, 122]];
  const VALUE_BASIS = { assessed_total: "assessed value", full_market_value: "market value", just_value: "market value" };

  const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("en-US"));
  const money = (n) => n == null ? "—" : n >= 1e9 ? "$" + (n / 1e9).toFixed(1) + " billion" : n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + " million" : "$" + fmt(Math.round(n));
  const short = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : fmt(n);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = (x) => Number(x) || 0;
  const monthName = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" }); };
  const peak = (obj) => Object.entries(obj || {}).reduce((best, [k, v]) => (v > best[1] ? [k, v] : best), ["", -1]);
  const series = (rows) => (rows || []).filter((r) => r && r.y).map((r) => [r.y, num(r.n)]);
  const qs = new URLSearchParams(location.search);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const bars = (rows) => { const max = Math.max(...rows.map((r) => r[1]), 1);
    return `<div class="bars">${rows.map(([l, v, shown]) => `<div class="brow"><span title="${esc(l)}">${esc(l)}</span><span><i style="width:${Math.max(2, (v / max) * 100)}%"></i></span><b>${esc(shown ?? fmt(v))}</b></div>`).join("")}</div>`; };
  const cols = (rows, hiKey) => { const max = Math.max(...rows.map((r) => r[1]), 1);
    return `<div class="cols">${rows.map(([k, v]) => `<i class="${k === hiKey ? "hi" : ""}" style="height:${Math.max(2, (v / max) * 100)}%" title="${esc(k)}: ${fmt(v)}"></i>`).join("")}</div>
      <div class="cols-x"><span>${esc(rows[0]?.[0] ?? "")}</span><span>${esc(rows[rows.length - 1]?.[0] ?? "")}</span></div>`; };
  const stats = (rows) => `<div class="stats">${rows.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  const topEntries = (obj, n, map, skip = []) => Object.entries(obj || {}).filter(([k]) => !skip.includes(k)).sort((a, b) => b[1] - a[1]).slice(0, n).map(([k, v]) => [map ? map[k] || k : k, v]);

  // The densest spot of a set of points: the busiest grid cell, then its centroid.
  function hotSpot(arr, cell) {
    if (!arr.length) return null;
    const cells = new Map();
    for (const p of arr) { const k = Math.floor(p[0] / cell) + ":" + Math.floor(p[1] / cell); const c = cells.get(k) || [0, 0, 0]; c[0] += p[0]; c[1] += p[1]; c[2]++; cells.set(k, c); }
    let best = null; for (const c of cells.values()) if (!best || c[2] > best[2]) best = c;
    return { at: [best[0] / best[2], best[1] / best[2]], n: best[2] };
  }

  function walkLegs(key, d) {
    const pts = d.points || [], cfg = NB[key], legs = [{ at: d.center, label: "Start", text: `We start in the middle of ${cfg.label}.` }];
    const add = (spot, label, text) => { if (spot) legs.push({ at: spot.at, label, text }); };
    const biz = pts.filter((p) => p[3] >= 4 && p[3] <= 6), vac = pts.filter((p) => p[3] === 7);
    const dated = pts.filter((p) => p[2] > 0).sort((a, b) => a[2] - b[2]);
    if (dated.length > 200) {
      const old = dated.slice(0, Math.floor(dated.length * 0.08)), s = hotSpot(old, cfg.cell);
      const y = Math.min(...old.map((p) => p[2]));
      add(s, "The oldest blocks", `Here are the oldest blocks: the earliest buildings around here go back to ${y}.`);
    }
    add(hotSpot(biz, cfg.cell), "Where business happens", key === "park-slope" ? "Now the shops: storefronts below, homes above, on the busiest business blocks." : "Now the commercial core, where most business parcels cluster.");
    if (key === "park-slope") add(hotSpot(pts.filter((p) => p[5] & 32), cfg.cell), "Room to grow", "These blocks hold lots that zoning would let build bigger than they stand today.");
    if (key === "coral-gables") { const rich = pts.filter((p) => p[4] > 0).sort((a, b) => b[4] - a[4]); add(hotSpot(rich.slice(0, Math.floor(rich.length * 0.05)), cfg.cell), "The highest values", "And here, the highest values in the city sit side by side."); }
    if (key === "east-hampton") { add(hotSpot(vac, cfg.cell), "Open land", "Open land: this is where empty lots cluster, waiting for their next use."); add(hotSpot(pts.filter((p) => p[5] & 64), cfg.cell * 2), "Estates", "And here, homes held by estates, where a family decides what happens next."); }
    return legs;
  }

  function chaptersFor(key, d, dv) {
    const u = d.uses || {}, o = d.owners || {}, ch = [];
    const decades = Object.entries(d.decades || {}).map(([k, v]) => [k + "s", v]);
    const [peakDec, peakDecN] = peak(d.decades);
    const cfg = NB[key];
    const walk = { aud: "all", eyebrow: "Walk through", title: `Walk ${cfg.label} with me.`, line: "A street-level pass through the spots the data says matter most.", walk: walkLegs(key, d), map: { mode: "walk" }, legend: "use", src: "Path built from the lake: the densest clusters of old buildings, businesses and opportunity." };
    const finale = dataverseChapter(dv);
    const B = d.business || {};

    if (key === "park-slope") {
      const H = d.history || {};
      const lmTotal = (H.lm_total || []).reduce((s, r) => s + num(r.n), 0);
      const brown = num((H.lm_mat || []).find((r) => r.mat_prim === "Brownstone")?.n);
      const styles = (H.lm_style || []).filter((r) => r.style_prim !== "Not determined");
      const arch = (H.lm_arch || [])[0] || {};
      const hpd = series(H.hpd_viol_by_year), hpdMax = hpd.reduce((b, r) => (r[1] > b[1] ? r : b), ["", 0]);
      const c311 = (H.c311_top || []).map((r) => [r.complaint_type.replace(/^HEAT\/HOT WATER$/, "Heat / hot water"), num(r.n)]);
      const trees = num(H.trees_total?.[0]?.n), species = (H.trees || []).map((r) => [r.spc_common.replace(/^./, (c) => c.toUpperCase()), num(r.n)]);
      const stations = new Set((H.subway || []).map((s) => s.stop_name)).size, entrances = (H.subway || []).length;
      const ent = o.entity || 0, sales = d.nyc_sales || {};
      const [pm, pmN] = peak(sales.by_month);
      const biz = d.biz || {}, bizN = Object.values(biz).reduce((s, v) => s + v[0], 0);
      const corp = series(B.corp_by_year), corpLast = corp.find((r) => r[0] === "2025"), corpNow = corp.find((r) => r[0] === "2026"), corpMax = corp.reduce((b, r) => (r[1] > b[1] ? r : b), ["", 0]);
      const cats = (B.lic_cats || []).map((r) => [r.business_category, num(r.n)]);
      ch.push({ aud: "all", eyebrow: "Brooklyn · ZIP 11215", title: "Park Slope", line: `${fmt(d.n)} lots. ${fmt(d.units)} homes. ${fmt(lmTotal)} landmarked buildings. This is its story, told by public record.`,
        chart: stats([[fmt(d.n), "lots"], [fmt(d.units), "homes"], [fmt(lmTotal), "landmarked"]]), map: { mode: "count", bearing: -20 },
        src: "Sources in this story: NYC PLUTO · Landmarks Preservation Commission · HPD · Dept. of Finance sales · 311 · Street Tree Census · MTA · NYS corporations · NYC licensed businesses" });
      ch.push(walk);
      ch.push({ aud: "edu re", eyebrow: "Origins", title: `Built around ${Math.round(d.median_year)}.`, line: `Half of Park Slope's buildings went up before ${Math.round(d.median_year)}. ${fmt(peakDecN)} still standing date to the ${peakDec}s, the busiest decade on record here.`,
        chart: cols(decades.filter((r) => parseInt(r[0]) >= 1850), peakDec + "s"), map: { mode: "year", bearing: 15 }, legend: "year",

      material: { ambient: 0.65, diffuse: 0.5, shininess: 20 }, opacity: 0.9,
      updateTriggers: { getColorWeight: m.mode, getElevationWeight: m.mode }, transitions: { elevationScale: 1200 } })];
    if (m.mode === "transit" && H.subway) L.push(new deck.ScatterplotLayer({ id: "pv-subway", data: H.subway, getPosition: (s) => [Number(s.entrance_longitude), Number(s.entrance_latitude)],
      getFillColor: [239, 127, 122], getLineColor: [51, 51, 51], stroked: true, lineWidthMinPixels: 2, getRadius: 28, radiusMinPixels: 6 }));
    return L;
  }

  // ── Camera ─────────────────────────────────────────────
  let camTimers = [];
  const clearCam = () => { camTimers.forEach(clearTimeout); camTimers = []; if (map) map.stop(); };
  // On a wide screen the panel covers the left of the map, so the camera centers in the open part.
  const pad = () => (innerWidth > 860 ? { left: 500, top: 30, right: 30, bottom: 30 } : { left: 0, top: 0, right: 0, bottom: 0 });
  const bearingTo = (a, b) => { const y = (b[0] - a[0]) * Math.cos((a[1] * Math.PI) / 180), x = b[1] - a[1]; return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360; };

  function moveCamera(chapter) {
    if (!map) return;
    clearCam();
    const d = state.data[state.nb], cfg = NB[state.nb], m = chapter.map || {};
    if (chapter.walk) return walk(chapter.walk);
    const zoom = cfg.zoom - (m.zoomOut || 0), bearing = m.bearing ?? 0, pitch = m.pitch ?? cfg.pitch;
    map.flyTo({ center: d.center, zoom, pitch, bearing, padding: pad(), duration: reduceMotion ? 0 : 2400, essential: true });
    if (!reduceMotion && state.playing) camTimers.push(setTimeout(() => map.easeTo({ bearing: bearing + 14, duration: PACE - 2600, easing: (t) => t }), 2500));
  }

  function walk(legs) {
    const cfg = NB[state.nb], legEl = document.getElementById("leg");
    legEl.style.display = "block";
    legs.forEach((leg, k) => {
      camTimers.push(setTimeout(() => {
        const prev = legs[Math.max(0, k - 1)].at, next = legs[Math.min(legs.length - 1, k + 1)].at;
        const bearing = k === 0 ? bearingTo(leg.at, next) : bearingTo(prev, leg.at);
        legEl.innerHTML = `<b>${k + 1} / ${legs.length} · ${esc(leg.label)}</b>${esc(leg.text)}`;
        if (map) map.flyTo({ center: leg.at, zoom: cfg.walkZoom, pitch: 76, bearing, padding: pad(), duration: reduceMotion ? 0 : LEG - 900, curve: 1.2, essential: true });
        if (state.voice) speak(leg.text);
      }, k * LEG));
    });
  }

  // ── Voice ──────────────────────────────────────────────
  let voicePick = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter((v) => /^en(-|_)?US/i.test(v.lang));
    voicePick = vs.find((v) => /Natural|Google US English|Samantha|Aria|Jenny/i.test(v.name)) || vs[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); if (voicePick) u.voice = voicePick; u.rate = 1; u.pitch = 1;
    speechSynthesis.speak(u);
  }
  const speechMs = (text) => Math.max(0, text.split(/\s+/).length * 390 + 900);

  // ── Lot story (tap the map) ────────────────────────────
  function showLot(ll) {
    const d = state.data[state.nb]; if (!d) return;
    let best = null, bd = Infinity; const cos = Math.cos((ll.lat * Math.PI) / 180);
    for (const p of d.points) { const dx = (p[0] - ll.lng) * cos, dy = p[1] - ll.lat, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = p; } }
    const el = document.getElementById("lot");
    if (!best || Math.sqrt(bd) > 0.0015) { el.style.display = "none"; return; }
    const tags = [];
    if (best[5] & 1) tags.push("Owner lives there"); if (best[5] & 2) tags.push("Absentee owner"); if (best[5] & 4) tags.push("Out of state");
    if (best[5] & 8) tags.push("Company-owned"); if (best[5] & 64) tags.push("Estate"); if (best[5] & 16) tags.push("Same owner since 2021"); if (best[5] & 32) tags.push("Room to build bigger");
    const basis = VALUE_BASIS[d.value_basis] || "value";
    el.innerHTML = `<button class="x" aria-label="Close">×</button><h2>This lot's story</h2><ul>
      <li>${best[2] > 0 ? `Built in <b>${best[2]}</b>, ${new Date().getFullYear() - best[2]} years ago` : "Year built not on record"}</li>
      <li>${esc(GROUP[best[3]][0])}</li>
      ${best[4] > 0 ? `<li>${esc(money(best[4] * 1000))} ${esc(basis)}</li>` : ""}</ul>
      ${tags.length ? `<div class="tags">${tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      <p>The owner, sales and full history open in the records app.</p>`;
    el.style.display = "block";
    el.querySelector(".x").onclick = () => (el.style.display = "none");
  }

  // ── Story state ────────────────────────────────────────
  const state = { nb: NB[qs.get("n")] ? qs.get("n") : "park-slope", aud: AUD[qs.get("a")] ? qs.get("a") : "all", i: 0, playing: qs.get("play") !== "0", voice: false, data: {}, dv: null, list: [] };
  const $ = (id) => document.getElementById(id);

  function legendHtml(kind) {
    if (!kind) return "";
    if (kind === "use") return Object.values(GROUP).slice(0, 8).map(([l, c]) => `<span><i style="background:rgb(${c})"></i>${esc(l)}</span>`).join("");
    if (kind === "year") return `<span>Column height = buildings · color: newer</span><span class="ramp"></span><span>older</span>`;
    if (kind === "value") return `<span>Height + color = average value: lower</span><span class="ramp"></span><span>higher</span>`;
    if (kind === "transit") return `<span><i style="background:#ef7f7a"></i>Subway entrance</span><span>Columns = parcels</span>`;
    if (kind === "licenses") return `<span><i style="background:#ef7f7a"></i>Licensed business</span><span><i style="background:#c8ece8"></i>Every lot</span>`;
    if (kind === "valueadd") return `<span><i style="background:#ef7f7a"></i>${state.nb === "park-slope" ? "Room to build bigger" : state.nb === "coral-gables" ? "House built before 1960" : "Estate-held"}</span><span><i style="background:#e8c46e"></i>Vacant</span>`;
    if (kind === "count") return `<span>Column height = parcels · color: fewer</span><span class="ramp"></span><span>more</span>`;
    if (kind.startsWith("share:")) return `<span>${esc(kind.slice(6))}: low</span><span class="ramp"></span><span>high</span>`;
    return "";
  }

  function show(i) {
    const list = state.list; if (!list.length) return;
    state.i = (i + list.length) % list.length;
    const c = list[state.i];
    $("eyebrow").textContent = c.eyebrow;
    $("count").textContent = `${state.i + 1} / ${list.length}`;
    $("title").textContent = c.title;
    $("line").textContent = c.line;
    $("leg").style.display = "none";
    $("chart").innerHTML = c.chart || "";
    const why = state.aud !== "all" && c.why && c.why[state.aud];
    $("why").innerHTML = why ? `<div class="why"><b>${WHY_LABEL[state.aud]}</b>${esc(why)}</div>` : "";
    $("legend").innerHTML = legendHtml(c.legend);
    $("src").textContent = c.src || "";
    $("cta").innerHTML = c.final ? `<div class="cta"><a href="parcelvora-landing.html">See Parcelvora →</a><a href="parcelvora-records.html">Try the records →</a></div>` : "";
    $("dots").innerHTML = list.map((_, k) => `<button aria-label="Chapter ${k + 1}" ${k === state.i ? 'aria-current="true"' : ""} data-k="${k}"></button>`).join("");
    render(); moveCamera(c);
    const said = `${c.title} ${c.line}${why ? " " + why : ""}`;
    if (state.voice && !c.walk) speak(said);
    restartTimer(c.walk ? c.walk.length * LEG + 800 : Math.max(PACE, state.voice ? speechMs(said) : 0));
    const p = new URLSearchParams({ n: state.nb, a: state.aud, c: state.i + 1 }); history.replaceState(null, "", "?" + p.toString());
  }

  const hex = (rgb) => "#" + rgb.map((v) => v.toString(16).padStart(2, "0")).join("");
  function render() {
    if (!mapReady || !state.list.length || !state.data[state.nb]) return;
    const c = state.list[state.i], walking = !!c.walk;
    const feats = walking ? state.data[state.nb].points.filter((p) => p[3] >= 4 && p[3] <= 7)
      .map((p) => ({ type: "Feature", geometry: { type: "Point", coordinates: [p[0], p[1]] }, properties: { c: hex(GROUP[p[3]][1]) } })) : [];
    map.getSource("pv-walk").setData({ type: "FeatureCollection", features: feats });
    overlay.setProps({ layers: walking ? [] : layersFor(c) });
  }

  let timer = null, lastDur = PACE;
  function restartTimer(dur) {
    if (dur) lastDur = dur;
    clearTimeout(timer);
    const bar = $("prog"); bar.style.transition = "none"; bar.style.width = "0";
    if (!state.playing) return;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${lastDur}ms linear`; bar.style.width = "100%"; }));
    timer = setTimeout(() => show(state.i + 1), lastDur);
  }
  function setPlaying(on) {
    state.playing = on; $("play").textContent = on ? "❚❚" : "▶"; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
    if (!on) { clearCam(); if ("speechSynthesis" in window) speechSynthesis.cancel(); clearTimeout(timer); $("prog").style.transition = "none"; }
    else show(state.i);
  }

  async function load(nb) {
    if (!state.dv) state.dv = await (await fetch("parcelvora-story/dataverse.json")).json();
    if (!state.data[nb]) state.data[nb] = await (await fetch(`parcelvora-story/${nb}.json`)).json();
    const all = chaptersFor(nb, state.data[nb], state.dv);
    state.list = all.filter((c) => c.aud === "all" || state.aud === "all" || c.aud.split(" ").includes(state.aud));
  }

  async function choose(nb, aud, at) {
    state.nb = nb; state.aud = aud;
    document.querySelectorAll("#nbSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === nb)));
    document.querySelectorAll("#audSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === aud)));
    $("lot").style.display = "none";
    $("title").textContent = "Loading the story…";
    try { await load(nb); } catch (e) { $("title").textContent = "The story data did not load. Refresh to try again."; return; }
    show(Math.min(at || 0, state.list.length - 1));
  }

  $("nbSeg").insertAdjacentHTML("beforeend", Object.entries(NB).map(([k, v]) => `<button data-k="${k}" aria-pressed="false">${v.label}</button>`).join(""));
  $("audSeg").insertAdjacentHTML("beforeend", Object.entries(AUD).map(([k, v]) => `<button data-k="${k}" aria-pressed="false">${v}</button>`).join(""));
  $("nbSeg").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) choose(b.dataset.k, state.aud, 0); });
  $("audSeg").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) choose(state.nb, b.dataset.k, 0); });
  $("prev").onclick = () => show(state.i - 1);
  $("next").onclick = () => show(state.i + 1);
  $("play").onclick = () => setPlaying(!state.playing);
  $("voice").onclick = () => {
    state.voice = !state.voice; $("voice").setAttribute("aria-pressed", String(state.voice));
    if (!state.voice && "speechSynthesis" in window) speechSynthesis.cancel();
    show(state.i);
  };
  if (!("speechSynthesis" in window)) $("voice").style.display = "none";
  $("dots").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) show(Number(b.dataset.k)); });
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(state.i + 1); else if (e.key === "ArrowLeft") show(state.i - 1); else if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!state.playing); } });
  const sizeBar = () => document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px");
  addEventListener("resize", sizeBar); sizeBar();
  $("play").textContent = state.playing ? "❚❚" : "▶";
  choose(state.nb, state.aud, Math.max(0, (Number(qs.get("c")) || 1) - 1));
})();
</script>
</body>
</html>
