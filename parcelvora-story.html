<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parcelvora Story Mode</title>
<meta name="description" content="Every neighborhood in New York and Florida, told by its data, in 3D, with a walk-through and narration.">
<link rel="icon" href="parcelvora-fox.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
<style>
:root {
  --mint: #8bdad4; --mint-soft: #c8ece8; --mint-pale: #e8f7f5; --white: #fff;
  --ink: #333333; --ink-2: #474747; --line: #333333;
  --coral: #ef7f7a; --pink: #f6a8a4; --lime: #a8d26d; --gold: #e8c46e;
  --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--mint-pale); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }

.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--mint); border-bottom: 1.5px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.mark { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: #fdfcf8; border: 1.5px solid var(--line); flex-shrink: 0; }
.mark img { width: 100%; height: 100%; display: block; }
.word { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.word small { font-family: var(--sans); font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg .lbl { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-right: 2px; }
.seg button { border: 1.5px solid var(--line); background: var(--white); border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--mint); }

#map { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar-h, 64px); }
.mapmsg { position: fixed; right: 16px; top: calc(var(--bar-h, 64px) + 12px); z-index: 12; display: none; background: var(--white); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 600; max-width: 360px; }

.panel { position: fixed; z-index: 15; left: 20px; top: calc(var(--bar-h, 64px) + 18px); bottom: 20px; width: 450px; display: flex; flex-direction: column; background: var(--white); border: 2px solid var(--line); border-radius: 20px; box-shadow: 10px 10px 0 var(--mint); overflow: hidden; }
.p-scroll { flex: 1; overflow-y: auto; padding: 22px 22px 8px; }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { display: flex; align-items: center; gap: 9px; font: 700 15px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .12em; margin: 0; }
.eyebrow::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--coral); border: 1.5px solid var(--line); flex-shrink: 0; }
.count { font-size: 15px; font-weight: 700; white-space: nowrap; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1.04; letter-spacing: -0.02em; margin: 12px 0 0; }
.line { font-size: 18px; color: var(--ink-2); margin: 10px 0 0; }
.leg { margin-top: 12px; border-radius: 12px; background: var(--mint-pale); border: 1.5px solid var(--line); padding: 10px 14px; font-size: 17px; font-weight: 600; display: none; }
.leg b { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; }
.chart { margin-top: 16px; }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: minmax(0, 1.5fr) 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.brow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow i { display: block; height: 14px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--mint); min-width: 4px; }
.brow:nth-child(2n) i { background: var(--lime); }
.brow:nth-child(3n) i { background: var(--pink); }
.brow b { font-variant-numeric: tabular-nums; }
.cols { display: flex; align-items: flex-end; gap: 3px; height: 120px; border-bottom: 1.5px solid var(--line); }
.cols i { flex: 1; background: var(--mint); border: 1.5px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; min-height: 2px; }
.cols i.hi { background: var(--coral); }
.cols-x { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--mint-pale); min-width: 0; }
.stats b { display: block; font-family: var(--serif); font-size: 25px; font-weight: 600; line-height: 1.05; }
.stats span { font-size: 15px; }
.why { margin-top: 16px; border-radius: 12px; border: 1.5px solid var(--coral); background: #fff3f2; padding: 12px 14px; font-size: 16px; }
.why b { display: block; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
.legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); display: inline-block; }
.legend .ramp { width: 90px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); background: linear-gradient(90deg, #d6f0ed, #8bdad4, #5ebeb6, #a8d26d, #f6a8a4, #ef7f7a); }
.src { margin-top: 14px; font-size: 15px; color: var(--ink-2); }
.tip { margin-top: 10px; font-size: 15px; font-weight: 600; }
.cta { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 16px; }
.cta a { font-weight: 700; border-bottom: 2.5px solid var(--coral); text-decoration: none; padding-bottom: 2px; }
.p-ctl { border-top: 1.5px solid var(--line); padding: 12px 16px 14px; background: var(--mint-pale); }
.prog { height: 6px; border-radius: 3px; background: var(--mint-soft); overflow: hidden; border: 1px solid rgba(51,51,51,.35); }
.prog i { display: block; height: 100%; width: 0; background: var(--coral); }
.ctl-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { min-width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--white); cursor: pointer; font-size: 16px; font-weight: 700; padding: 0 10px; white-space: nowrap; }
.btns button:hover { background: var(--ink); color: var(--mint); }
.btns button[aria-pressed="true"] { background: var(--ink); color: var(--mint); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.dots button { width: 13px; height: 13px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line); background: var(--white); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--coral); }

.lot { position: fixed; z-index: 16; right: 16px; bottom: 40px; width: 320px; display: none; background: var(--white); border: 2px solid var(--line); border-radius: 16px; box-shadow: 6px 6px 0 var(--coral); padding: 14px 16px; }
.lot h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0; line-height: 1.1; }
.lot ul { margin: 8px 0 0; padding-left: 18px; font-size: 16px; }
.lot .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.lot .tags span { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 15px; font-weight: 700; background: var(--mint-soft); }
.lot .x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 20px; font-weight: 700; cursor: pointer; }
.lot p { font-size: 15px; margin: 8px 0 0; }

.start { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; top: var(--bar-h, 64px); display: grid; place-items: center; padding: 16px; background: rgba(139, 218, 212, .62); backdrop-filter: blur(3px); }
.start-card { width: min(560px, 100%); max-height: calc(100vh - var(--bar-h, 64px) - 32px); overflow-y: auto; background: var(--white); border: 2px solid var(--line); border-radius: 22px; box-shadow: 12px 12px 0 var(--coral); padding: 28px; text-align: center; }
/* The tile is a span: it needs display:block, or its size is ignored and the fox fills the whole card. */
.start-card .mark { display: block; width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 14px; }
.start-card .eyebrow { justify-content: center; }
.start-card h2 { font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; margin: 12px 0 0; }
.start-card p { font-size: 18px; color: var(--ink-2); margin: 10px 0 0; }
.start-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; }
.start-btns button { border: 2px solid var(--line); border-radius: 12px; padding: 15px 22px; font-size: 17px; font-weight: 700; letter-spacing: .03em; cursor: pointer; background: var(--ink); color: var(--white); }
.start-btns button.ghost { background: var(--white); color: var(--ink); }
.start-btns button:hover { background: var(--coral); color: var(--ink); }
.start-card .start-note { font-size: 15px; margin-top: 16px; }

@media (max-width: 860px) {
  body { overflow-y: auto; }
  .start-card h2 { font-size: 34px; }
  #map { position: relative; top: auto; height: 52vh; margin-top: var(--bar-h, 110px); }
  .mapmsg { position: absolute; }
  .panel { position: relative; left: auto; top: auto; bottom: auto; width: auto; margin: 14px 16px 24px; box-shadow: 6px 6px 0 var(--mint); }
  .p-scroll { overflow: visible; }
  h1 { font-size: 34px; }
  .word { font-size: 23px; }
  .lot { left: 16px; right: 16px; width: auto; top: calc(var(--bar-h, 110px) + 12px); bottom: auto; position: absolute; }
}
</style>
<style>
/* Parcelvora brand, from Silvia's design: navy ink, cream paper, burnt orange, Instrument Serif + Inter + DM Mono. */
:root { --mint: #ece5d8; --mint-soft: #ece5d8; --mint-pale: #f4efe6; --ink: #13202f; --ink-2: #5b6573; --line: #ddd5c6;
  --coral: #d9771f; --pink: #e9c9a4; --lime: #26405f; --gold: #e9a35a; --navy: #0f1c2d; --orange: #c0611a; --blue: #26405f;
  --serif: "Instrument Serif", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "DM Mono", ui-monospace, Consolas, monospace; }
body { background: #f4efe6; }
.bar { background: var(--navy); border-bottom: 1px solid rgba(255,255,255,.12); color: #efe9de; }
.word { font-family: var(--serif); font-weight: 400; font-size: 32px; letter-spacing: 0; color: #f4efe6; }
.word b { color: #e08a3c; font-weight: 400; }
.word small { font-family: var(--mono); font-weight: 500; color: #e9a35a; letter-spacing: .16em; }
.mark { border-color: rgba(255,255,255,.5); }
.seg .lbl { font-family: var(--mono); font-weight: 500; color: #c9c2b5; letter-spacing: .16em; }
.seg button { border-color: rgba(239,233,222,.45); background: transparent; color: #efe9de; border-radius: 4px; }
.seg button[aria-pressed="true"] { background: #d9771f; color: var(--navy); border-color: #d9771f; }
.panel { background: #fbf8f2; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px rgba(15,28,45,.28); }
h1 { font-weight: 400; font-size: 46px; line-height: 1.02; letter-spacing: -0.01em; }
.start-card h2, .lot h2, .stats b { font-weight: 400; }
.eyebrow { font-family: var(--mono); font-weight: 500; letter-spacing: .16em; color: var(--ink-2); }
.eyebrow::before { background: #d9771f; border-color: #d9771f; }
.count { font-family: var(--mono); font-weight: 500; }
.brow i { background: var(--blue); border-color: var(--blue); border-radius: 2px; }
.brow:nth-child(2n) i { background: #d9771f; border-color: #d9771f; }
.brow:nth-child(3n) i { background: #b9a888; border-color: #b9a888; }
.cols { border-bottom-color: var(--ink); }
.cols i { background: var(--blue); border-color: var(--blue); border-radius: 2px 2px 0 0; }
.cols i.hi { background: #d9771f; border-color: #d9771f; }
.stats div { background: #f4efe6; border: 1px solid var(--line); border-radius: 6px; }
.stats b { color: var(--ink); font-size: 30px; }
.why { border-color: #d9771f; background: #fbeee0; border-radius: 6px; }
.why b { font-family: var(--mono); font-weight: 500; color: var(--orange); letter-spacing: .14em; }
.leg b { font-family: var(--mono); font-weight: 500; letter-spacing: .12em; }
.legend .ramp { background: linear-gradient(90deg, #e9e2d4, #c8bea9, #8fa0b4, #26405f, #e9a35a, #c0611a); }
.leg { background: #f4efe6; border-color: var(--line); border-radius: 6px; }
.cta a { border-bottom-color: #d9771f; }
.p-ctl { background: #f4efe6; border-top-color: var(--line); }
.prog { background: #e6dfd1; border-color: var(--line); }
.prog i { background: #d9771f; }
.btns button { border: 1px solid #cfc6b5; color: var(--ink); background: #fbf8f2; border-radius: 4px; }
.btns button:hover, .btns button[aria-pressed="true"] { background: var(--navy); color: #e9a35a; border-color: var(--navy); }
.dots button { border-color: var(--ink-2); }
.dots button[aria-current="true"] { background: #d9771f; border-color: #d9771f; }
.lot { background: #fbf8f2; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 44px rgba(15,28,45,.3); }
.lot .tags span { background: #ece5d8; border-color: #cfc6b5; color: var(--ink); border-radius: 4px; }
.start { background: rgba(15,28,45,.62); }
.start-card { background: #fbf8f2; border: 0; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.start-card h2 { font-size: 50px; }
.start-btns button { border: 2px solid #d9771f; background: #d9771f; color: var(--navy); border-radius: 4px; }
.start-btns button.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.start-btns button:hover { background: #e9a35a; border-color: #e9a35a; color: var(--navy); }
@media (max-width: 860px) { .panel { box-shadow: 0 12px 30px rgba(10,26,47,.2); } }
.find { display: flex; gap: 6px; flex: 1 1 300px; max-width: 540px; margin-left: auto; }
.find input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid rgba(239,233,222,.45); border-radius: 4px; background: #fbf8f2; color: var(--ink); }
.find button { font: inherit; font-size: 15px; font-weight: 600; padding: 9px 14px; border: 2px solid #d9771f; background: #d9771f; color: var(--navy); border-radius: 4px; cursor: pointer; white-space: nowrap; }
.find button:disabled { opacity: .7; cursor: wait; }
.pin { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.pin span { background: var(--navy); color: #fbf8f2; font: 600 13px/1.3 var(--sans); padding: 5px 9px; border-radius: 4px; max-width: 220px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.28); }
.pin i { width: 2px; height: 22px; background: var(--navy); }
.pin.home span { background: #d9771f; color: var(--navy); }
.pin.home i { background: #d9771f; }
.tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tlist li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; background: #fbf8f2; border: 1px solid var(--line); border-radius: 6px; font-size: 15px; }
.tlist .tn { min-width: 0; overflow-wrap: anywhere; }
.tlist b { font-family: var(--mono); font-weight: 500; color: var(--orange); white-space: nowrap; }
.rt { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; margin-right: 3px; border-radius: 12px; font: 700 13px/1 var(--sans); }
.rt.k { border-radius: 4px; padding: 0 7px; background: var(--navy); color: #f4efe6; font-weight: 600; }
.src a { color: inherit; }
.make { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(15,28,45,.62); }
.make[hidden] { display: none; }
.make-card { position: relative; width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #fbf8f2; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.4); padding: 26px; }
.make-card h2 { font-family: var(--serif); font-weight: 400; font-size: 36px; margin: 4px 0 14px; color: var(--ink); }
.make-card .x { position: absolute; top: 12px; right: 14px; border: 0; background: none; font-size: 28px; cursor: pointer; color: var(--ink); }
.make-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.make-tabs button, .make-btns button { font: inherit; font-size: 15px; font-weight: 600; padding: 8px 14px; border: 1px solid #cfc6b5; background: #f4efe6; color: var(--ink); border-radius: 4px; cursor: pointer; }
.make-tabs button[aria-selected="true"], .make-btns button:hover { background: var(--navy); color: #e9a35a; border-color: var(--navy); }
.make textarea { width: 100%; font: 15px/1.5 var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px; resize: vertical; }
.make-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
@media (max-width: 860px) { .find { margin-left: 0; max-width: none; } }
</style>
</head>
<body>

<div class="bar" id="bar">
  <a class="brand" href="parcelvora-landing.html">
    <span class="mark"><img src="parcelvora-fox.png" alt=""></span>
    <span class="word">Parcel<b>vora</b><small>Story Mode</small></span>
  </a>
  <div class="seg" id="nbSeg" role="group" aria-label="Neighborhood"><span class="lbl">Place</span></div>
  <form class="find" id="find" role="search"><input id="findQ" type="search" placeholder="Any address or neighborhood in NY or FL" aria-label="Find any address or neighborhood" autocomplete="off"><button type="submit" id="findBtn">Tell its story</button></form>
</div>

<div id="map" aria-label="3D map of the neighborhood"></div>
<div class="mapmsg" id="mapmsg"></div>

<section class="panel" aria-live="polite">
  <div class="p-scroll">
    <div class="p-top"><p class="eyebrow" id="eyebrow"></p><span class="count" id="count"></span></div>
    <h1 id="title">Loading the story…</h1>
    <p class="line" id="line"></p>
    <div class="leg" id="leg"></div>
    <div class="chart" id="chart"></div>
    <div class="legend" id="legend"></div>
    <p class="src" id="src"></p>
    <p class="tip" id="tip">Tap anywhere on the map for that lot's story.</p>
    <div id="cta"></div>
  </div>
  <div class="p-ctl">
    <div class="prog"><i id="prog"></i></div>
    <div class="ctl-row">
      <div class="btns">
        <button id="prev" aria-label="Previous chapter">◀</button>
        <button id="play" aria-label="Pause">❚❚</button>
        <button id="next" aria-label="Next chapter">▶</button>
        <button id="voice" aria-pressed="false" aria-label="Narration">🔊 Voice</button>
        <button id="music" aria-pressed="true" aria-label="Music">🎵 Music</button>
        <button id="make" aria-label="Create content">✎ Create content</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</section>

<aside class="lot" id="lot" aria-live="polite"></aside>

<audio id="song" src="media/nextier-story-song-2.m4a" preload="auto" loop></audio>

<div class="start" id="start" role="dialog" aria-labelledby="startTitle">
  <div class="start-card">
    <span class="mark"><img src="parcelvora-fox.png" alt=""></span>
    <p class="eyebrow">Parcelvora Story Mode</p>
    <h2 id="startTitle">The story of <span id="startPlace">Park Slope</span>.</h2>
    <p>Told by public record, on a 3D map, set to music.</p>
    <div class="start-btns">
      <button id="go" type="button">▶ Play with music</button>
      <button id="goVoice" class="ghost" type="button">▶ Music + narrator</button>
    </div>
    <p class="start-note">Search any address or neighborhood at the top, any time.</p>
  </div>
</div>

<div class="make" id="makeBox" role="dialog" aria-labelledby="makeTitle" hidden>
  <div class="make-card">
    <button class="x" id="makeX" type="button" aria-label="Close">×</button>

  function historyParts(text) {

    if (people && people.POP100) {
      const sqmi = (people.AREALAND || 0) / 2589988.11, dens = sqmi ? Math.round(people.POP100 / sqmi) : 0;
      ch.push({ eyebrow: "Who lives here", title: `${fmt(people.POP100)} neighbors.`, line: `About ${fmt(people.POP100)} people live in the census tract around ${isProp ? "this address" : "here"}, in ${fmt(people.HU100)} homes${dens ? `: about ${fmt(dens)} people per square mile` : ""}.`,
        chart: stats([[fmt(people.POP100), "people"], [fmt(people.HU100), "homes"], [dens ? fmt(dens) : "—", "per sq mi"]]), at, zoom: 14.6, pitch: 45, bearing: 250, pins: [home],
        src: `Source: US Census Bureau, 2020 Census · ${people.NAME || "census tract"}` });
    }
    // 9 · the walk: past the places with a story, down main street, to the train
    const legs = [{ at, label: "Start", text: isProp ? `We start at ${addr || "the front door"}.` : `We start in the middle of ${hood}.` }];
    walkOrder(at, stops.slice(0, 3)).forEach((s) => legs.push({ at: s.at, label: s.title, text: s.text }));
    if (mainAt) legs.push({ at: mainAt, label: "Main street", text: "Now main street, where the shops and restaurants cluster." });
    if (rail && rail.d < 3000) legs.push({ at: rail.at, label: rail.name, text: `And here's the ${rail.kind === "Subway" ? "subway" : "train"} at ${rail.name}, ${mins(rail.d)} from where we started.` });
    if (legs.length > 2) ch.push({ eyebrow: "Walk through", title: `Walk ${hood || "the block"} with me.`, line: "A street-level pass past the places with a story, down main street and to the train.",
      walk: legs, map: { mode: "walk" }, src: "Stops: Wikipedia · Mapbox / OpenStreetMap · MTA" });
    // 10 · the end card
    ch.push({ eyebrow: "Parcelvora Story Mode", title: isProp ? "Every property has a story." : "Every neighborhood has a story.", final: true, at, zoom: 15.2, pitch: 50, bearing: 0, pins: [home],
      line: "Search any address or neighborhood in New York or Florida at the top. Or turn this story into an article, a video script or a social post.", src: "" });
    state.live.where = where; state.live.hood = hood; if (!state.live.homeLabel) state.live.homeLabel = hood;
    return ch;
  }

  // ── Map ────────────────────────────────────────────────
  let map = null, overlay = null, mapReady = false;
  const mapMsg = (t) => { const el = document.getElementById("mapmsg"); el.textContent = t; el.style.display = t ? "block" : "none"; };
  try {
    mapboxgl.accessToken = MAPBOX_TOKEN;
    map = new mapboxgl.Map({ container: "map", style: "mapbox://styles/mapbox/standard", projection: "mercator",
      config: { basemap: { lightPreset: "day", showPointOfInterestLabels: false } },
      center: [-73.98, 40.667], zoom: 13, pitch: 55, bearing: -20, antialias: true });
    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), "bottom-right");
    map.on("load", () => {
      // Street-level dots for the walk-through are drawn by Mapbox itself, so they sit on the street among the 3D buildings.
      map.addSource("pv-walk", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({ id: "pv-walk-dots", type: "circle", source: "pv-walk", paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 13, 2, 16, 5, 18, 10], "circle-color": ["get", "c"],
        "circle-stroke-color": "#13202f", "circle-stroke-width": 1, "circle-pitch-alignment": "map" } });
      overlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
      map.addControl(overlay);
      mapReady = true;
      render();
    });
    map.on("error", (e) => { if (!mapReady) mapMsg("The map did not load. The story still plays."); });
    map.on("click", (e) => showLot(e.lngLat));
  } catch (e) {
    mapMsg("The 3D map needs WebGL. The story still plays.");
  }

  const weight = { year: (p) => (p[2] > 0 ? 2030 - p[2] : 0) };

  function layersFor(chapter) {
    const m = chapter.map || {}, cfg = NB[state.nb], d = state.data[state.nb], pts = d.points || [], H = d.history || {}, B = d.business || {};
    if (!m.mode || m.mode === "none" || state.nb === "live") return [];
    const dots = (id, data, color, radius, minPx, line) => new deck.ScatterplotLayer({ id, data, getPosition: (p) => [p[0], p[1]], getFillColor: color,
      getRadius: radius, radiusMinPixels: minPx, stroked: !!line, getLineColor: [19, 32, 47], lineWidthMinPixels: line || 0, opacity: 0.95, updateTriggers: { getFillColor: m.mode } });
    if (m.mode === "use") return [dots("pv-dots", pts, (p) => GROUP[p[3]][1], cfg.radius * 0.2, 1.5, 0)];
    if (m.mode === "biz") return [dots("pv-dots", pts.filter((p) => p[3] >= 4 && p[3] <= 6), (p) => GROUP[p[3]][1], cfg.radius * 0.32, 3, 0.75)];
    if (m.mode === "licenses") return [dots("pv-faint", pts, [222, 214, 198], cfg.radius * 0.25, 1, 0),
      dots("pv-lic", B.lic_points || [], [217, 119, 31], cfg.radius * 0.6, 5, 1.5)];
    const data = m.mode === "year" ? pts.filter((p) => p[2] > 0) : pts;
    const w = weight[m.mode];
    const L = [new deck.HexagonLayer({ id: "pv-hex", data, getPosition: (p) => [p[0], p[1]], radius: cfg.radius, coverage: 0.86, extruded: true,
      elevationRange: [0, cfg.maxH], elevationScale: 1, upperPercentile: 99, colorRange: RAMP,
      getColorWeight: w || (() => 1), colorAggregation: w ? "MEAN" : "SUM",
      getElevationWeight: () => 1, elevationAggregation: "SUM",
      material: { ambient: 0.65, diffuse: 0.5, shininess: 20 }, opacity: 0.9,
      updateTriggers: { getColorWeight: m.mode, getElevationWeight: m.mode }, transitions: { elevationScale: 1200 } })];
    if (m.mode === "transit" && H.subway) L.push(new deck.ScatterplotLayer({ id: "pv-subway", data: H.subway, getPosition: (s) => [Number(s.entrance_longitude), Number(s.entrance_latitude)],
      getFillColor: [217, 119, 31], getLineColor: [19, 32, 47], stroked: true, lineWidthMinPixels: 2, getRadius: 28, radiusMinPixels: 6 }));
    return L;
  }

  // ── Camera ─────────────────────────────────────────────
  let camTimers = [];
  const clearCam = () => { camTimers.forEach(clearTimeout); camTimers = []; if (map) map.stop(); };
  // On a wide screen the panel covers the left of the map, so the camera centers in the open part.
  const pad = () => (innerWidth > 860 ? { left: 500, top: 30, right: 30, bottom: 30 } : { left: 0, top: 0, right: 0, bottom: 0 });
  const bearingTo = (a, b) => { const y = (b[0] - a[0]) * Math.cos((a[1] * Math.PI) / 180), x = b[1] - a[1]; return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360; };

  function moveCamera(chapter) {
    if (!map) return;
    clearCam();
    const d = state.data[state.nb], cfg = NB[state.nb], m = chapter.map || {};
    if (chapter.walk) return walk(chapter.walk);
    // a chapter about one place (a landmark, the station, main street) flies there; the rest frame the neighborhood
    const center = chapter.at || d.center, zoom = chapter.zoom ?? cfg.zoom - (m.zoomOut || 0), bearing = chapter.bearing ?? m.bearing ?? 0, pitch = chapter.pitch ?? m.pitch ?? cfg.pitch;
    map.flyTo({ center, zoom, pitch, bearing, padding: pad(), duration: reduceMotion ? 0 : 2400, essential: true });
    if (!reduceMotion && state.playing) camTimers.push(setTimeout(() => map.easeTo({ bearing: bearing + 14, duration: PACE - 2600, easing: (t) => t }), 2500));
  }

  function walk(legs) {
    const cfg = NB[state.nb], legEl = document.getElementById("leg");
    legEl.style.display = "block";
    legs.forEach((leg, k) => {
      camTimers.push(setTimeout(() => {
        const prev = legs[Math.max(0, k - 1)].at, next = legs[Math.min(legs.length - 1, k + 1)].at;
        const bearing = k === 0 ? bearingTo(leg.at, next) : bearingTo(prev, leg.at);
        legEl.innerHTML = `<b>${k + 1} / ${legs.length} · ${esc(leg.label)}</b>${esc(leg.text)}`;
        setPins({ pins: [{ at: leg.at, label: leg.label }] });
        if (map) map.flyTo({ center: leg.at, zoom: cfg.walkZoom, pitch: 76, bearing, padding: pad(), duration: reduceMotion ? 0 : LEG - 900, curve: 1.2, essential: true });
        if (state.voice) speak(leg.text);
      }, k * LEG));
    });
  }

  // ── Voice ──────────────────────────────────────────────
  let voicePick = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter((v) => /^en(-|_)?US/i.test(v.lang));
    voicePick = vs.find((v) => /Natural|Google US English|Samantha|Aria|Jenny/i.test(v.name)) || vs[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); if (voicePick) u.voice = voicePick; u.rate = 1; u.pitch = 1;
    u.onstart = () => fadeTo(MUSIC_UNDER);
    u.onend = u.onerror = () => fadeTo(MUSIC_FULL);
    speechSynthesis.speak(u);
  }

  // ── Thomas's song ──────────────────────────────────────
  // Plays only after a press (browsers block sound until then); dips under the narrator, then comes back.
  const song = document.getElementById("song"), MUSIC_FULL = 0.6, MUSIC_UNDER = 0.18;
  song.volume = MUSIC_FULL;
  let fadeTimer = null;
  function fadeTo(v, ms = 450) {
    clearInterval(fadeTimer);
    const from = song.volume, t0 = performance.now();
    fadeTimer = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); song.volume = from + (v - from) * k; if (k >= 1) clearInterval(fadeTimer); }, 40);
  }
  function syncSong() {
    if (state.playing && state.music) { const pr = song.play(); if (pr && pr.catch) pr.catch(() => {}); }
    else song.pause();
  }
  const speechMs = (text) => Math.max(0, text.split(/\s+/).length * 390 + 900);

  // ── Lot story (tap the map) ────────────────────────────
  function showLot(ll) {
    const d = state.data[state.nb]; if (!d || !d.points || !d.points.length) return;
    let best = null, bd = Infinity; const cos = Math.cos((ll.lat * Math.PI) / 180);
    for (const p of d.points) { const dx = (p[0] - ll.lng) * cos, dy = p[1] - ll.lat, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = p; } }
    const el = document.getElementById("lot");
    if (!best || Math.sqrt(bd) > 0.0015) { el.style.display = "none"; return; }
    el.innerHTML = `<button class="x" aria-label="Close">×</button><h2>This lot's story</h2><ul>
      <li>${best[2] > 0 ? `Built in <b>${best[2]}</b>, ${YEAR - best[2]} years ago` : "Year built not on record"}</li>
      <li>${esc(GROUP[best[3]][0])}</li></ul>
      <p>Its full record opens in the records app.</p>`;
    el.style.display = "block";
    el.querySelector(".x").onclick = () => (el.style.display = "none");
  }

  // ── Story state ────────────────────────────────────────
  const state = { nb: NB[qs.get("n")] ? qs.get("n") : "park-slope", i: 0, playing: false, voice: false, music: false, data: {}, dv: null, list: [], live: null };
  const $ = (id) => document.getElementById(id);

  function legendHtml(kind) {
    if (!kind) return "";
    if (kind === "use") return Object.values(GROUP).slice(0, 8).map(([l, c]) => `<span><i style="background:rgb(${c})"></i>${esc(l)}</span>`).join("");
    if (kind === "year") return `<span>Column height = buildings · color: newer</span><span class="ramp"></span><span>older</span>`;
    if (kind === "transit") return `<span><i style="background:#d9771f"></i>Subway entrance</span><span>Columns = parcels</span>`;
    if (kind === "licenses") return `<span><i style="background:#d9771f"></i>Licensed business</span><span><i style="background:#ded6c6"></i>Every lot</span>`;
    if (kind === "count") return `<span>Column height = parcels · color: fewer</span><span class="ramp"></span><span>more</span>`;
    return "";
  }

  // Pins name the places a chapter is about; the first pin of a live story is the property itself.
  let pinMarkers = [];
  function setPins(c) {
    pinMarkers.forEach((m) => m.remove()); pinMarkers = [];
    if (!map || !window.mapboxgl) return;
    (c.pins || []).forEach((p, k) => {
      if (!p || !p.at) return;
      const el = document.createElement("div");
      el.className = "pin" + (k === 0 && state.nb === "live" && !c.walk && p.label === (state.live && state.live.homeLabel) ? " home" : "");
      el.innerHTML = `<span>${esc(p.label || "")}</span><i></i>`;
      pinMarkers.push(new mapboxgl.Marker({ element: el, anchor: "bottom" }).setLngLat(p.at).addTo(map));
    });
  }

  function show(i) {
    const list = state.list; if (!list.length) return;
    state.i = (i + list.length) % list.length;
    const c = list[state.i];
    $("eyebrow").textContent = c.eyebrow || "";
    $("count").textContent = `${state.i + 1} / ${list.length}`;
    $("title").textContent = c.title;
    $("line").textContent = c.line;
    $("leg").style.display = "none";
    $("chart").innerHTML = c.chart || "";
    $("legend").innerHTML = legendHtml(c.legend);
    $("src").innerHTML = c.srcUrl ? `<a href="${esc(c.srcUrl)}" target="_blank" rel="noopener">${esc(c.src)}</a>` : esc(c.src || "");
    $("tip").style.display = state.nb === "live" ? "none" : "";
    const rec = state.live && state.live.addr ? `<a href="${RECORDS}?q=${encodeURIComponent(state.live.addr)}">Open the full record →</a>` : `<a href="${RECORDS}">Try the records →</a>`;
    $("cta").innerHTML = c.final ? `<div class="cta"><a href="#" data-make="1">✎ Create content</a>${rec}<a href="parcelvora-landing.html">See Parcelvora →</a></div>` : "";
    $("dots").innerHTML = list.map((_, k) => `<button aria-label="Chapter ${k + 1}" ${k === state.i ? 'aria-current="true"' : ""} data-k="${k}"></button>`).join("");
    render(); setPins(c); moveCamera(c);
    const said = `${c.title} ${c.line}`;
    if (state.voice && !c.walk) speak(said);
    restartTimer(c.walk ? c.walk.length * LEG + 800 : Math.max(PACE, state.voice ? speechMs(said) : 0));
    const p = state.nb === "live" ? new URLSearchParams(location.search) : new URLSearchParams({ n: state.nb });
    p.set("c", state.i + 1); history.replaceState(null, "", "?" + p.toString());
  }

  const hex = (rgb) => "#" + rgb.map((v) => v.toString(16).padStart(2, "0")).join("");
  function render() {
    if (!mapReady || !state.list.length || !state.data[state.nb]) return;
    const c = state.list[state.i], walking = !!c.walk, pts = state.data[state.nb].points || [];
    const feats = walking ? pts.filter((p) => p[3] >= 4 && p[3] <= 7)
      .map((p) => ({ type: "Feature", geometry: { type: "Point", coordinates: [p[0], p[1]] }, properties: { c: hex(GROUP[p[3]][1]) } })) : [];
    map.getSource("pv-walk").setData({ type: "FeatureCollection", features: feats });
    overlay.setProps({ layers: walking ? [] : layersFor(c) });
  }

  let timer = null, lastDur = PACE;
  function restartTimer(dur) {
    if (dur) lastDur = dur;
    clearTimeout(timer);
    const bar = $("prog"); bar.style.transition = "none"; bar.style.width = "0";
    if (!state.playing) return;
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${lastDur}ms linear`; bar.style.width = "100%"; }));
    timer = setTimeout(() => show(state.i + 1), lastDur);
  }
  function setPlaying(on) {
    state.playing = on; $("play").textContent = on ? "❚❚" : "▶"; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
    if (on) $("start").style.display = "none";
    syncSong();
    if (!on) { clearCam(); if ("speechSynthesis" in window) speechSynthesis.cancel(); clearTimeout(timer); $("prog").style.transition = "none"; }
    else show(state.i);
  }
  function startStory(withVoice) {
    if (withVoice && "speechSynthesis" in window) { state.voice = true; $("voice").setAttribute("aria-pressed", "true"); }
    state.music = true; $("music").setAttribute("aria-pressed", "true");
    try { song.currentTime = 0; } catch (e) {}
    setPlaying(true);
  }

  // A prepared neighborhood: the lake's summary, plus its Wikipedia history and the stories of the places nearby.
  async function load(nb) {
    if (!state.dv) state.dv = await (await fetch("parcelvora-story/dataverse.json")).json();
    if (!state.data[nb]) {
      const d = await (await fetch(`parcelvora-story/${nb}.json`)).json();
      const [page, stops] = await Promise.all([withTimeout(wikiPage(WIKI_TITLE[nb]).catch(() => null), 8000), withTimeout(storiesNear(d.center, NB[nb].radius > 200 ? 6000 : 2000).catch(() => []), 8000)]);
      d.stops = (stops || []).filter((s) => !page || s.title !== page.title);
      d.tales = talesFrom(page, d.stops);
      state.data[nb] = d;
    }
    state.list = chaptersFor(nb, state.data[nb], state.dv);
  }

  async function choose(nb, at) {
    if (nb !== state.nb && state.playing && state.music) { try { song.currentTime = 0; } catch (e) {} }
    state.nb = nb;
    $("startPlace").textContent = NB[nb].label;
    document.querySelectorAll("#nbSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === nb)));
    $("lot").style.display = "none";
    $("title").textContent = "Loading the story…";
    try { await load(nb); } catch (e) { $("title").textContent = "The story data did not load. Refresh to try again."; return; }
    state.i = Math.min(at || 0, state.list.length - 1);
    if (autoplay) setPlaying(true); else show(state.i);
  }

  // Any address or place: told live. The records app links here with what it knows about the property.
  async function startLive(L) {
    state.nb = "live"; state.live = L; L.homeLabel = L.kind === "place" ? L.place : titleCase(L.addr) || "Here";
    $("startPlace").textContent = L.kind === "place" ? L.place : titleCase(L.addr) || "this place";
    $("title").textContent = "Gathering its story…";
    $("line").textContent = "History, the places nearby with a story, how people get around, and who lives here.";
    if (map) map.jumpTo({ center: [L.lon, L.lat], zoom: 15, pitch: 55, bearing: -20 });
    try { state.list = await buildLive(L); state.data.live = { center: [L.lon, L.lat], points: [] }; }
    catch (e) { $("title").textContent = "The story did not load. Refresh to try again."; return; }
    state.i = Math.min(Math.max(0, (Number(qs.get("c")) || 1) - 1), state.list.length - 1);
    if (autoplay) setPlaying(true); else show(state.i);
  }

  // ── Create content: the same story as an article, a video script or a social post ──
  const tag = (s) => String(s || "").replace(/[^A-Za-z0-9]/g, "");
  function storyName() { return state.nb === "live" ? state.live.homeLabel : NB[state.nb].label; }
  function contentText(kind) {
    const name = storyName(), body = state.list.filter((c) => !c.final && !c.walk);
    const srcs = [...new Set(body.map((c) => (c.src || "").replace(/^Sources?( in this story)?:\s*/, "")).filter(Boolean))];
    if (kind === "article") return [`${name}: a story told by public record`, "",
      ...body.map((c) => `${c.eyebrow ? c.eyebrow.toUpperCase() + "\n" : ""}${c.title}\n${c.line}\n`), "Sources", ...srcs.map((s) => "· " + s), "", "Made with Parcelvora Story Mode."].join("\n");
    if (kind === "script") return [`${name}: video script (about 60 seconds)`, "",
      ...body.slice(0, 8).map((c, k) => `SCENE ${k + 1} · ${c.eyebrow || "Opening"}\nON SCREEN: ${c.pins && c.pins.length ? "aerial, flying to " + c.pins[c.pins.length - 1].label : "aerial of " + name}\nVOICE: ${c.title} ${firstSentence(c.line)}\n`),
      "END CARD: Every place has a story. Parcelvora Story Mode."].join("\n");
    const fact = body.find((c) => /History|Did you know/.test(c.eyebrow || "")) || body[1] || body[0] || { line: "", title: name };
    const region = state.nb === "live" ? state.live.region : state.nb === "coral-gables" ? "FL" : "NY";
    return [`${name}, told by public record.`, "", firstSentence(fact.line) || fact.title, "",
      ...body.filter((c) => c !== fact).slice(0, 3).map((c) => `• ${c.title}`), "", `#${tag(name)} #history #neighborhoods #${region === "FL" ? "Florida" : "NewYork"}`].join("\n");
  }
  let makeKind = "article";
  function openMake(kind) {
    makeKind = kind || makeKind;
    $("makeTitle").textContent = storyName();
    document.querySelectorAll("#makeTabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.k === makeKind)));
    $("makeText").value = contentText(makeKind);
    $("makeAi").hidden = !AI_URL;
    $("makeNote").textContent = AI_URL ? "" : "Written straight from this story's sources. AI writing turns on where Parcelvora's server holds an AI key.";
    $("makeBox").hidden = false;
  }
  $("make").onclick = () => openMake();
  $("cta").addEventListener("click", (e) => { if (e.target.closest("[data-make]")) { e.preventDefault(); openMake(); } });
  $("makeTabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) openMake(b.dataset.k); });
  $("makeX").onclick = () => { $("makeBox").hidden = true; };
  $("makeBox").addEventListener("click", (e) => { if (e.target === $("makeBox")) $("makeBox").hidden = true; });
  $("makeCopy").onclick = async () => { try { await navigator.clipboard.writeText($("makeText").value); $("makeCopy").textContent = "Copied"; } catch (e) { $("makeText").select(); document.execCommand("copy"); $("makeCopy").textContent = "Copied"; } setTimeout(() => { $("makeCopy").textContent = "Copy"; }, 1600); };
  $("makeSave").onclick = () => {
    const a = document.createElement("a"), url = URL.createObjectURL(new Blob([$("makeText").value], { type: "text/plain" }));
    a.href = url; a.download = `${storyName().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}-${makeKind}.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  // With the server's AI key: the same facts and sources, rewritten as a narrated piece that cites them.
  $("makeAi").onclick = async () => {
    if (!AI_URL) return;
    $("makeAi").disabled = true; $("makeNote").textContent = "Writing…";
    try {
      const body = state.list.filter((c) => !c.final && !c.walk).map((c) => ({ title: c.title, line: c.line, src: c.src, url: c.srcUrl || null }));
      const r = await fetch(AI_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ kind: makeKind, place: storyName(), where: state.live ? state.live.where : NB[state.nb].label, facts: body }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      $("makeText").value = j.text + (j.citations && j.citations.length ? "\n\nSources\n" + j.citations.map((u) => "· " + u).join("\n") : "");
      $("makeNote").textContent = "Written by AI from this story's facts and the sources it cites. Read it before you publish.";
    } catch (e) { $("makeNote").textContent = "AI writing did not answer: " + String(e.message || e).slice(0, 120); }
    $("makeAi").disabled = false;
  };

  // ── Find any address or neighborhood ───────────────────
  $("find").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("findQ").value.trim(); if (!q) return;
    $("findBtn").disabled = true; $("findBtn").textContent = "Finding…";
    const r = await fetch("https://api.mapbox.com/search/geocode/v6/forward?" + new URLSearchParams({ q, country: "us", bbox: "-87.7,24.4,-71.8,45.1", limit: "1",
      types: "address,street,neighborhood,locality,place,postcode", access_token: MAPBOX_TOKEN })).then((x) => x.json()).catch(() => null);
    $("findBtn").disabled = false; $("findBtn").textContent = "Tell its story";
    const f = r && r.features && r.features[0];
    if (!f) { $("findQ").value = ""; $("findQ").placeholder = "Not found. Try an address or a neighborhood in NY or FL."; return; }
    const [lon, lat] = f.geometry.coordinates, p = f.properties;
    const next = new URLSearchParams({ lat: lat.toFixed(6), lon: lon.toFixed(6) });
    if (p.feature_type === "address") next.set("addr", p.name); else next.set("place", p.name);
    location.search = next.toString();
  });

  $("nbSeg").insertAdjacentHTML("beforeend", Object.entries(NB).filter(([k]) => k !== "live").map(([k, v]) => `<button data-k="${k}" aria-pressed="false">${v.label}</button>`).join(""));
  $("nbSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    if (state.nb === "live") { location.search = "?n=" + b.dataset.k; return; }
    choose(b.dataset.k, 0);
  });
  $("prev").onclick = () => show(state.i - 1);
  $("next").onclick = () => show(state.i + 1);
  $("play").onclick = () => setPlaying(!state.playing);
  $("voice").onclick = () => {
    state.voice = !state.voice; $("voice").setAttribute("aria-pressed", String(state.voice));
    if (!state.voice && "speechSynthesis" in window) speechSynthesis.cancel();
    show(state.i);
  };
  if (!("speechSynthesis" in window)) { $("voice").style.display = "none"; $("goVoice").style.display = "none"; }
  $("music").onclick = () => { state.music = !state.music; $("music").setAttribute("aria-pressed", String(state.music)); syncSong(); };
  $("go").onclick = () => startStory(false);
  $("goVoice").onclick = () => startStory(true);
  // No start screen: a story opens straight on its first chapter and plays (sound waits for a tap, as browsers require).
  $("start").style.display = "none"; $("music").setAttribute("aria-pressed", "false");
  const autoplay = qs.get("play") !== "0";
  $("dots").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) show(Number(b.dataset.k)); });
  document.addEventListener("keydown", (e) => {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") show(state.i + 1); else if (e.key === "ArrowLeft") show(state.i - 1); else if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!state.playing); }
    else if (e.key === "Escape") $("makeBox").hidden = true;
  });
  const sizeBar = () => document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px");
  addEventListener("resize", sizeBar); sizeBar();
  $("play").textContent = state.playing ? "❚❚" : "▶";
  const lat0 = Number(qs.get("lat")), lon0 = Number(qs.get("lon"));
  if (qs.get("lat") && qs.get("lon") && Number.isFinite(lat0) && Number.isFinite(lon0)) {
    const get = (k) => qs.get(k) || "";
    startLive({ lat: lat0, lon: lon0, addr: get("addr"), town: get("town"), region: get("region"), id: get("id"), yb: get("yb"), use: get("use"), ls: get("ls"), place: get("place"), kind: get("place") || get("kind") === "place" ? "place" : "property" });
  } else if (NB[qs.get("n")]) choose(state.nb, Math.max(0, (Number(qs.get("c")) || 1) - 1));
  else {
    // Opened with no property and no place: ask for one. Park Slope and the others stay one tap away under Place.
    $("eyebrow").textContent = "Parcelvora Story Mode"; $("count").textContent = "";
    $("title").textContent = "Tell the story of any address or neighborhood.";
    $("line").textContent = "Type an address or a neighborhood in New York or Florida at the top. From the records, open a property and press its Story button.";
    $("tip").style.display = "none";
    if (map) map.jumpTo({ center: [-74.2, 41.2], zoom: 6.2, pitch: 30, bearing: 0 });
    setTimeout(() => $("findQ").focus(), 300);
  }
})();
</script>
</body>
</html>
